<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台 - 阿里云流量查询系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ===== CSS变量 ===== */
        :root{
            --sidebar-w:240px;
            --sidebar-bg:#1a1a2e;
            --sidebar-hover:#16213e;
            --sidebar-active:rgba(102,126,234,0.15);
            --sidebar-active-color:#667eea;
            --main-bg:#f5f7fa;
            --card-bg:#fff;
            --card-radius:12px;
            --card-shadow:0 2px 12px rgba(0,0,0,0.08);
            --primary:#667eea;
            --primary-grad:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            --success:#10b981;
            --danger:#ef4444;
            --warning:#f59e0b;
            --text-primary:#1a1a2e;
            --text-secondary:#6b7280;
            --border:#e5e7eb;
        }
        /* ===== 全局重置 ===== */
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            background:var(--main-bg);color:var(--text-primary);font-size:14px}
        a{text-decoration:none;color:inherit}
        /* ===== 布局 ===== */
        .admin-wrapper{display:flex;min-height:100vh}
        /* ===== 侧边栏 ===== */
        .sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);display:flex;flex-direction:column;
            position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform 0.3s}
        .sidebar-header{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,0.08)}
        .sidebar-header h2{color:#fff;font-size:16px;font-weight:700}
        .sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
        .sidebar-nav ul{list-style:none}
        .sidebar-nav li a{display:flex;align-items:center;padding:12px 24px;color:rgba(255,255,255,0.65);
            font-size:14px;transition:all 0.2s;gap:12px}
        .sidebar-nav li a:hover{background:var(--sidebar-hover);color:#fff}
        .sidebar-nav li.active a{background:var(--sidebar-active);color:var(--sidebar-active-color);
            border-right:3px solid var(--sidebar-active-color)}
        .sidebar-nav li a .icon{width:20px;height:20px;flex-shrink:0}
        .sidebar-nav li a .icon svg{width:20px;height:20px}
        .sidebar-footer{padding:12px 0;border-top:1px solid rgba(255,255,255,0.08)}
        .sidebar-footer a{display:flex;align-items:center;padding:12px 24px;color:rgba(255,255,255,0.5);
            font-size:14px;gap:12px;transition:color 0.2s}
        .sidebar-footer a:hover{color:var(--danger)}
        .sidebar-footer a .icon{width:20px;height:20px}
        .sidebar-footer a .icon svg{width:20px;height:20px}
        /* 手机端菜单按钮 */
        .menu-toggle{display:none;position:fixed;top:16px;left:16px;z-index:200;
            width:40px;height:40px;background:var(--sidebar-bg);border:none;border-radius:8px;
            color:#fff;cursor:pointer;align-items:center;justify-content:center}
        .menu-toggle svg{width:24px;height:24px}
        /* 遮罩 */
        .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:90}
        /* ===== 主内容区 ===== */
        .main-content{flex:1;margin-left:var(--sidebar-w);min-width:0}
        .topbar{height:64px;background:var(--card-bg);border-bottom:1px solid var(--border);
            display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:50}
        .topbar h1{font-size:18px;font-weight:700}
        .topbar-right{display:flex;align-items:center;gap:16px}
        .admin-name{font-size:14px;color:var(--text-secondary)}
        .content{padding:24px 32px}
        /* ===== 卡片 ===== */
        .card{background:var(--card-bg);border-radius:var(--card-radius);box-shadow:var(--card-shadow);
            margin-bottom:24px;overflow:hidden}
        .card-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;
            align-items:center;justify-content:space-between}
        .card-header h3{font-size:16px;font-weight:600}
        .card-header a{color:var(--primary);font-size:13px}
        .card-body{padding:24px}
        /* ===== 统计卡片网格 ===== */
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:24px}
        .stat-card{background:var(--card-bg);border-radius:var(--card-radius);box-shadow:var(--card-shadow);
            padding:24px;display:flex;align-items:center;gap:16px;transition:transform 0.2s}
        .stat-card:hover{transform:translateY(-2px)}
        .stat-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .stat-icon svg{width:24px;height:24px;color:#fff}
        .stat-icon.purple{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
        .stat-icon.blue{background:linear-gradient(135deg,#0ea5e9 0%,#2563eb 100%)}
        .stat-icon.green{background:linear-gradient(135deg,#10b981 0%,#059669 100%)}
        .stat-icon.orange{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%)}
        .stat-info h4{font-size:13px;color:var(--text-secondary);font-weight:500;margin-bottom:4px}
        .stat-info .value{font-size:24px;font-weight:800;color:var(--text-primary)}
        .stat-info .value small{font-size:14px;font-weight:500;color:var(--text-secondary)}
        /* ===== 图表区域 ===== */
        .chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}
        .chart-wrapper{height:300px;position:relative}
        /* ===== 排行列表 ===== */
        .ranking-item{display:flex;align-items:center;padding:14px 24px;border-bottom:1px solid rgba(0,0,0,0.04);transition:background 0.2s}
        .ranking-item:last-child{border-bottom:none}
        .ranking-item:hover{background:rgba(102,126,234,0.03)}
        .ranking-pos{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;
            font-size:12px;font-weight:700;margin-right:14px;flex-shrink:0}
        .ranking-pos.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
        .ranking-pos.silver{background:linear-gradient(135deg,#9ca3af,#6b7280);color:#fff}
        .ranking-pos.bronze{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}
        .ranking-pos.normal{background:#f3f4f6;color:#6b7280}
        .ranking-name{flex:1;font-weight:500}
        .ranking-value{font-weight:700;color:var(--primary)}
        .empty-msg{padding:40px;text-align:center;color:var(--text-secondary)}
        /* ===== 响应式 ===== */
        @media(max-width:1024px){
            .stats-grid{grid-template-columns:repeat(2,1fr)}
            .chart-grid{grid-template-columns:1fr}
        }
        @media(max-width:768px){
            .sidebar{transform:translateX(-100%)}
            .sidebar.open{transform:translateX(0)}
            .sidebar-overlay.open{display:block}
            .menu-toggle{display:flex}
            .main-content{margin-left:0}
            .content{padding:16px}
            .topbar{padding:0 16px 0 56px}
            .stats-grid{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
    <!-- 手机端菜单按钮 -->
    <button class="menu-toggle" id="menuToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="admin-wrapper">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><h2>流量查询系统</h2></div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active">
                        <a href="admin.html">
                            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>
                            <span>控制台</span>
                        </a>
                    </li>
                    <li>
                        <a href="config.html">
                            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.32 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></span>
                            <span>阿里云配置</span>
                        </a>
                    </li>
                    <li>
                        <a href="traffic.html">
                            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
                            <span>流量统计</span>
                        </a>
                    </li>
                    <li>
                        <a href="server.html">
                            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1"/><circle cx="6" cy="18" r="1"/></svg></span>
                            <span>服务器管理</span>
                        </a>
                    </li>
                    <li>
                        <a href="system.html">
                            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>
                            <span>系统设置</span>
                        </a>
                    </li>
                    <li>
                        <a href="mail.html">
                            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
                            <span>邮箱配置</span>
                        </a>
                    </li>
                    <li>
                        <a href="logs.html">
                            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
                            <span>操作日志</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn">
                    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                    <span>注销</span>
                </a>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <header class="topbar">
                <h1>控制台</h1>
                <div class="topbar-right">
                    <span class="admin-name" id="adminName">欢迎</span>
                </div>
            </header>
            <div class="content">
                <!-- 统计卡片 -->
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-icon purple">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9"/></svg>
                        </div>
                        <div class="stat-info">
                            <h4>配置数量</h4>
                            <div class="value" id="statConfigCount">-</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                        </div>
                        <div class="stat-info">
                            <h4>今日流量</h4>
                            <div class="value" id="statTodayTraffic">- <small>GB</small></div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                        </div>
                        <div class="stat-info">
                            <h4>昨日流量</h4>
                            <div class="value" id="statYesterdayTraffic">- <small>GB</small></div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                        </div>
                        <div class="stat-info">
                            <h4>本月流量</h4>
                            <div class="value" id="statMonthTraffic">- <small>GB</small></div>
                        </div>
                    </div>
                </div>

                <!-- 图表和排行 -->
                <div class="chart-grid">
                    <div class="card">
                        <div class="card-header"><h3>近7天流量趋势</h3></div>
                        <div class="card-body">
                            <div class="chart-wrapper"><canvas id="trendChart"></canvas></div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>流量排行 TOP</h3></div>
                        <div id="rankingList"><div class="empty-msg">加载中...</div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        /**
         * 后台控制台首页
         * 加载仪表盘数据，渲染统计卡片、趋势图、排行榜
         */
        (function(){
            // 检查登录状态
            checkAuth();

            /**
             * 检查登录状态，未登录跳转登录页
             */
            function checkAuth(){
                fetch('/api/auth/check',{credentials:'same-origin'})
                    .then(function(r){return r.json()})
                    .then(function(d){
                        if(!d.success||!d.data||!d.data.logged_in){window.location.href='login.html';return}
                        document.getElementById('adminName').textContent='欢迎，'+(d.data.admin.nickname||d.data.admin.username);
                    })
                    .catch(function(){window.location.href='login.html'});
            }

            /**
             * 格式化字节为GB
             * @param {number} bytes - 字节数
             * @returns {string} 格式化后的GB值
             */
            function toGB(bytes){return(bytes/1024/1024/1024).toFixed(2)}

            /**
             * 加载仪表盘数据
             */
            fetch('/api/traffic/dashboard',{credentials:'same-origin'})
                .then(function(r){return r.json()})
                .then(function(resp){
                    if(!resp.success){return}
                    var d=resp.data;
                    // 渲染统计卡片
                    document.getElementById('statConfigCount').innerHTML=d.configCount+' / '+d.totalConfigCount;
                    document.getElementById('statTodayTraffic').innerHTML=toGB(d.todayTraffic)+' <small>GB</small>';
                    document.getElementById('statYesterdayTraffic').innerHTML=toGB(d.yesterdayTraffic)+' <small>GB</small>';
                    document.getElementById('statMonthTraffic').innerHTML=toGB(d.monthTrafficOut||d.monthTrafficTotal)+' <small>GB</small>';

                    // 渲染趋势图
                    var labels=[],data=[];
                    if(d.weeklyStats&&d.weeklyStats.length){
                        d.weeklyStats.forEach(function(r){
                            labels.push(r.record_date.substring(5));
                            data.push((r.traffic_total/1024/1024/1024).toFixed(2));
                        });
                    }
                    new Chart(document.getElementById('trendChart'),{
                        type:'line',
                        data:{labels:labels,datasets:[{
                            label:'每日流量(GB)',data:data,
                            borderColor:'#667eea',backgroundColor:'rgba(102,126,234,0.1)',
                            fill:true,tension:0.4,pointBackgroundColor:'#667eea',pointRadius:5,pointHoverRadius:7
                        }]},
                        options:{
                            responsive:true,maintainAspectRatio:false,
                            plugins:{legend:{display:false},tooltip:{
                                backgroundColor:'rgba(26,26,46,0.9)',padding:12,cornerRadius:8,
                                callbacks:{label:function(c){return c.parsed.y+' GB'}}
                            }},
                            scales:{
                                x:{grid:{display:false},ticks:{color:'#6b7280'}},
                                y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.05)'},ticks:{color:'#6b7280',callback:function(v){return v+' GB'}}}
                            }
                        }
                    });

                    // 渲染排行榜
                    var html='';
                    if(d.ranking&&d.ranking.length){
                        d.ranking.forEach(function(r,i){
                            var cls=i===0?'gold':i===1?'silver':i===2?'bronze':'normal';
                            html+='<div class="ranking-item"><div class="ranking-pos '+cls+'">'+(i+1)+'</div>'
                                +'<div class="ranking-name">'+(r.name||'未命名')+'</div>'
                                +'<div class="ranking-value">'+toGB(r.traffic_total)+' GB</div></div>';
                        });
                    }else{
                        html='<div class="empty-msg">暂无数据</div>';
                    }
                    document.getElementById('rankingList').innerHTML=html;
                })
                .catch(function(){
                    document.getElementById('statsGrid').innerHTML='<div class="empty-msg">数据加载失败，请刷新重试</div>';
                });

            // 注销按钮
            document.getElementById('logoutBtn').addEventListener('click',function(e){
                e.preventDefault();
                fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})
                    .then(function(){window.location.href='login.html'});
            });

            // 手机端侧边栏切换
            document.getElementById('menuToggle').addEventListener('click',function(){
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('sidebarOverlay').classList.toggle('open');
            });
            document.getElementById('sidebarOverlay').addEventListener('click',function(){
                document.getElementById('sidebar').classList.remove('open');
                this.classList.remove('open');
            });
        })();
    </script>
</body>
</html>
