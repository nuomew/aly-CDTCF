<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器管理 - 阿里云流量查询系统</title>
    <style>
        :root{--sidebar-w:240px;--sidebar-bg:#1a1a2e;--sidebar-hover:#16213e;--sidebar-active:rgba(102,126,234,0.15);--sidebar-active-color:#667eea;--main-bg:#f5f7fa;--card-bg:#fff;--card-radius:12px;--card-shadow:0 2px 12px rgba(0,0,0,0.08);--primary:#667eea;--primary-grad:linear-gradient(135deg,#667eea 0%,#764ba2 100%);--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--text-primary:#1a1a2e;--text-secondary:#6b7280;--border:#e5e7eb}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--main-bg);color:var(--text-primary);font-size:14px}
        a{text-decoration:none;color:inherit}
        .admin-wrapper{display:flex;min-height:100vh}
        .sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform 0.3s}
        .sidebar-header{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,0.08)}.sidebar-header h2{color:#fff;font-size:16px;font-weight:700}
        .sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}.sidebar-nav ul{list-style:none}
        .sidebar-nav li a{display:flex;align-items:center;padding:12px 24px;color:rgba(255,255,255,0.65);font-size:14px;transition:all 0.2s;gap:12px}
        .sidebar-nav li a:hover{background:var(--sidebar-hover);color:#fff}
        .sidebar-nav li.active a{background:var(--sidebar-active);color:var(--sidebar-active-color);border-right:3px solid var(--sidebar-active-color)}
        .sidebar-nav li a .icon{width:20px;height:20px;flex-shrink:0}.sidebar-nav li a .icon svg{width:20px;height:20px}
        .sidebar-footer{padding:12px 0;border-top:1px solid rgba(255,255,255,0.08)}
        .sidebar-footer a{display:flex;align-items:center;padding:12px 24px;color:rgba(255,255,255,0.5);font-size:14px;gap:12px;transition:color 0.2s}
        .sidebar-footer a:hover{color:var(--danger)}.sidebar-footer a .icon{width:20px;height:20px}.sidebar-footer a .icon svg{width:20px;height:20px}
        .menu-toggle{display:none;position:fixed;top:16px;left:16px;z-index:200;width:40px;height:40px;background:var(--sidebar-bg);border:none;border-radius:8px;color:#fff;cursor:pointer;align-items:center;justify-content:center}
        .menu-toggle svg{width:24px;height:24px}.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:90}
        .main-content{flex:1;margin-left:var(--sidebar-w);min-width:0}
        .topbar{height:64px;background:var(--card-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:50}
        .topbar h1{font-size:18px;font-weight:700}.content{padding:24px 32px}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
        .btn-primary{background:var(--primary-grad);color:#fff}.btn-primary:hover{box-shadow:0 4px 12px rgba(102,126,234,0.4)}
        .btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:0.9}
        .btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:0.9}
        .btn-warning{background:var(--warning);color:#fff}.btn-warning:hover{opacity:0.9}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-secondary)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
        .btn-sm{padding:5px 10px;font-size:12px}
        .card{background:var(--card-bg);border-radius:var(--card-radius);box-shadow:var(--card-shadow);margin-bottom:24px;overflow:hidden}
        .card-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .card-header h3{font-size:16px;font-weight:600}
        .table-wrap{overflow-x:auto}
        table{width:100%;border-collapse:collapse}
        th{background:#f8fafc;padding:12px 16px;text-align:left;font-weight:600;font-size:13px;color:var(--text-secondary);border-bottom:1px solid var(--border);white-space:nowrap}
        td{padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.04);font-size:13px}
        tr:nth-child(even){background:#fafbfc}tr:hover{background:rgba(102,126,234,0.03)}
        .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
        .badge-success{background:rgba(16,185,129,0.1);color:#059669}
        .badge-danger{background:rgba(239,68,68,0.1);color:#dc2626}
        .badge-warning{background:rgba(245,158,11,0.1);color:#d97706}
        .badge-info{background:rgba(59,130,246,0.1);color:#2563eb}
        .action-btns{display:flex;gap:6px;flex-wrap:wrap}
        /* 弹窗 */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;align-items:center;justify-content:center}
        .modal-overlay.show{display:flex}
        .modal{background:var(--card-bg);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:600px;max-width:90vw;max-height:90vh;overflow-y:auto}
        .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .modal-header h3{font-size:16px;font-weight:700}
        .modal-close{width:32px;height:32px;border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--text-secondary);border-radius:6px;display:flex;align-items:center;justify-content:center}
        .modal-close:hover{background:#f3f4f6}
        .modal-body{padding:24px}
        /* 详情网格 */
        .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .detail-item{padding:10px 14px;background:#f8fafc;border-radius:8px}
        .detail-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
        .detail-value{font-size:14px;font-weight:600}
        .detail-item.full{grid-column:1/-1}
        .empty-msg{padding:40px;text-align:center;color:var(--text-secondary)}
        .toast{position:fixed;top:24px;right:24px;padding:14px 20px;border-radius:10px;color:#fff;font-size:14px;font-weight:500;z-index:9999;transform:translateX(120%);transition:transform 0.3s;max-width:360px}
        .toast.show{transform:translateX(0)}.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--primary)}
        @media(max-width:768px){
            .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.sidebar-overlay.open{display:block}
            .menu-toggle{display:flex}.main-content{margin-left:0}.content{padding:16px}.topbar{padding:0 16px 0 56px}
            .detail-grid{grid-template-columns:1fr}
            .modal{margin:16px}
        }
    </style>
    <script src="/js/auth.js"></script>
</head>
<body>
    <button class="menu-toggle" id="menuToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><h2>流量查询系统</h2></div>
            <nav class="sidebar-nav"><ul>
                <li><a href="admin.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span><span>控制台</span></a></li>
                <li><a href="config.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9"/></svg></span><span>阿里云配置</span></a></li>
                <li><a href="traffic.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span><span>流量统计</span></a></li>
                <li class="active"><a href="server.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1"/><circle cx="6" cy="18" r="1"/></svg></span><span>服务器管理</span></a></li>
                <li><a href="system.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span><span>系统设置</span></a></li>
                <li><a href="mail.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span><span>邮箱配置</span></a></li>
                <li><a href="logs.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span><span>操作日志</span></a></li>
            </ul></nav>
            <div class="sidebar-footer"><a href="#" id="logoutBtn"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span>注销</span></a></div>
        </aside>

        <main class="main-content">
            <header class="topbar"><h1>服务器管理</h1></header>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>实例列表</h3>
                        <button class="btn btn-primary" onclick="loadInstances()">刷新列表</button>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>名称</th><th>实例ID</th><th>状态</th><th>类型</th><th>IP地址</th><th>地域</th><th>配置名称</th><th>操作</th></tr></thead>
                            <tbody id="instanceTable"><tr><td colspan="8" class="empty-msg">加载中...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 实例详情弹窗 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header"><h3>实例详情</h3><button class="modal-close" onclick="closeDetailModal()">&times;</button></div>
            <div class="modal-body" id="detailBody">加载中...</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /**
         * 服务器管理页面
         * 功能：实例列表、开机/关机/重启/VNC/详情
         */
        var instancesData=[];

        (function(){
            // 检查登录状态
            checkLoginStatus(function(admin) {
                document.getElementById('adminName').textContent='欢迎，'+(admin.nickname||admin.username);
            });
            // 加载实例列表
            loadInstances();
        })();

        /**
         * 显示Toast提示
         */
        function showToast(msg,type){
            var t=document.getElementById('toast');t.textContent=msg;
            t.className='toast toast-'+(type||'info')+' show';
            setTimeout(function(){t.classList.remove('show')},3000);
        }

        /**
         * HTML转义
         */
        function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}

        /**
         * 获取状态徽章HTML
         * @param {string} status - 实例状态
         * @returns {string} 徽章HTML
         */
        function getStatusBadge(status){
            var map={
                'Running':['badge-success','运行中'],
                'Stopped':['badge-danger','已停止'],
                'Starting':['badge-warning','启动中'],
                'Stopping':['badge-warning','停止中'],
                'Pending':['badge-info','创建中'],
                'Deleting':['badge-warning','删除中']
            };
            var m=map[status]||['badge-warning',status||'未知'];
            return'<span class="badge '+m[0]+'">'+m[1]+'</span>';
        }

        /**
         * 加载实例列表
         */
        function loadInstances(){
            document.getElementById('instanceTable').innerHTML='<tr><td colspan="8" class="empty-msg">正在加载...</td></tr>';
            authFetch('/api/ecs/instances')
                .then(function(resp){
                    if(!resp.success){document.getElementById('instanceTable').innerHTML='<tr><td colspan="8" class="empty-msg" style="color:var(--danger)">'+esc(resp.message||'加载失败')+'</td></tr>';return}
                    var list=resp.data||[];
                    instancesData=list;
                    var tbody=document.getElementById('instanceTable');
                    if(!list.length){
                        tbody.innerHTML='<tr><td colspan="8" class="empty-msg">暂无实例</td></tr>';return;
                    }
                    var html='';
                    list.forEach(function(inst,i){
                        html+='<tr>'
                            +'<td><strong>'+esc(inst.instanceName||'未命名')+'</strong></td>'
                            +'<td style="font-family:monospace;font-size:12px">'+esc(inst.instanceId)+'</td>'
                            +'<td>'+getStatusBadge(inst.status)+'</td>'
                            +'<td>'+esc(inst.instanceTypeText||inst.instanceType)+'</td>'
                            +'<td>'+(inst.publicIp||inst.privateIp||'-')+'</td>'
                            +'<td>'+esc(inst.regionId)+'</td>'
                            +'<td>'+esc(inst.configName)+'</td>'
                            +'<td><div class="action-btns">'
                            +(inst.status==='Stopped'?'<button class="btn btn-success btn-sm" onclick="doAction('+i+',\'start\')">开机</button>':'')
                            +(inst.status==='Running'?'<button class="btn btn-danger btn-sm" onclick="doAction('+i+',\'stop\')">关机</button>':'')
                            +(inst.status==='Running'?'<button class="btn btn-warning btn-sm" onclick="doAction('+i+',\'reboot\')">重启</button>':'')
                            +'<button class="btn btn-outline btn-sm" onclick="openVnc('+i+')">VNC</button>'
                            +'<button class="btn btn-outline btn-sm" onclick="showDetail('+i+')">详情</button>'
                            +'</div></td></tr>';
                    });
                    tbody.innerHTML=html;
                })
                .catch(function(){
                    document.getElementById('instanceTable').innerHTML='<tr><td colspan="8" class="empty-msg" style="color:var(--danger)">加载失败</td></tr>';
                });
        }

        /**
         * 执行实例操作（开机/关机/重启）
         * @param {number} index - 实例索引
         * @param {string} action - 操作类型：start/stop/reboot
         */
        function doAction(index,action){
            var inst=instancesData[index];
            if(!inst)return;
            var actionNames={start:'开机',stop:'关机',reboot:'重启'};
            if(!confirm('确定要'+actionNames[action]+'实例 '+inst.instanceId+' 吗？'))return;

            showToast('正在发送'+actionNames[action]+'指令...','info');
            authFetchJSON('/api/ecs/instance/action', 'POST', {config_id:inst.configId,instance_id:inst.instanceId,action:action})
            .then(function(d){
                if(d.success){showToast(d.message||'操作成功','success');setTimeout(loadInstances,3000)}
                else showToast(d.message||'操作失败','error')
            })
            .catch(function(){showToast('操作失败','error')});
        }

        /**
         * 打开VNC连接
         * @param {number} index - 实例索引
         */
        function openVnc(index){
            var inst=instancesData[index];
            if(!inst)return;
            // 直接打开阿里云控制台VNC页面
            var url='https://ecs.console.aliyun.com/vnc/'+inst.instanceId+'?regionId='+inst.regionId;
            window.open(url,'_blank');
        }

        /**
         * 显示实例详情
         * @param {number} index - 实例索引
         */
        function showDetail(index){
            var inst=instancesData[index];
            if(!inst)return;
            var body=document.getElementById('detailBody');
            body.innerHTML='加载中...';
            document.getElementById('detailModal').classList.add('show');

            authFetch('/api/ecs/instance/detail?config_id='+inst.configId+'&instance_id='+inst.instanceId)
                .then(function(resp){
                    if(!resp.success){body.innerHTML='<p style="color:var(--danger)">'+esc(resp.message||'加载失败')+'</p>';return}
                    var d=resp.data||{};
                    body.innerHTML='<div class="detail-grid">'
                        +'<div class="detail-item"><div class="detail-label">实例名称</div><div class="detail-value">'+esc(d.instanceName)+'</div></div>'
                        +'<div class="detail-item"><div class="detail-label">实例ID</div><div class="detail-value" style="font-family:monospace;font-size:12px">'+esc(d.instanceId)+'</div></div>'
                        +'<div class="detail-item"><div class="detail-label">状态</div><div class="detail-value">'+getStatusBadge(d.status)+'</div></div>'
                        +'<div class="detail-item"><div class="detail-label">实例类型</div><div class="detail-value">'+esc(d.instanceType)+'</div></div>'
                        +'<div class="detail-item"><div class="detail-label">操作系统</div><div class="detail-value">'+esc(d.osName)+'</div></div>'
                        +'<div class="detail-item"><div class="detail-label">地域</div><div class="detail-value">'+esc(d.regionId)+'</div></div>'
                        +'<div class="detail-item"><div class="detail-label">公网IP</div><div class="detail-value">'+(d.publicIp&&d.publicIp.length?d.publicIp.join(', '):'无')+'</div></div>'
                        +'<div class="detail-item"><div class="detail-label">内网IP</div><div class="detail-value">'+(d.innerIp&&d.innerIp.length?d.innerIp.join(', '):'无')+'</div></div>'
                        +'<div class="detail-item"><div class="detail-label">CPU</div><div class="detail-value">'+d.cpu+'核</div></div>'
                        +'<div class="detail-item"><div class="detail-label">内存</div><div class="detail-value">'+(d.memory/1024).toFixed(0)+'GB</div></div>'
                        +'<div class="detail-item"><div class="detail-label">带宽</div><div class="detail-value">'+d.internetMaxBandwidthOut+'Mbps</div></div>'
                        +'<div class="detail-item"><div class="detail-label">计费方式</div><div class="detail-value">'+esc(d.internetChargeType)+'</div></div>'
                        +'<div class="detail-item"><div class="detail-label">创建时间</div><div class="detail-value">'+esc(d.creationTime)+'</div></div>'
                        +'<div class="detail-item"><div class="detail-label">到期时间</div><div class="detail-value">'+esc(d.expiredTime)+'</div></div>'
                        +'<div class="detail-item full"><div class="detail-label">VPC ID</div><div class="detail-value" style="font-family:monospace;font-size:12px">'+esc(d.vpcId)+'</div></div>'
                        +'<div class="detail-item full"><div class="detail-label">安全组</div><div class="detail-value" style="font-family:monospace;font-size:12px">'+(d.securityGroupIds?d.securityGroupIds.join(', '):'无')+'</div></div>'
                        +'</div>';
                })
                .catch(function(){body.innerHTML='<p style="color:var(--danger)">加载失败</p>'});
        }

        /** 关闭详情弹窗 */
        function closeDetailModal(){document.getElementById('detailModal').classList.remove('show')}

        // 注销
        document.getElementById('logoutBtn').addEventListener('click',function(e){
            e.preventDefault();
            logout();
        });
        // 手机端侧边栏
        document.getElementById('menuToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open')});
        document.getElementById('sidebarOverlay').addEventListener('click',function(){document.getElementById('sidebar').classList.remove('open');this.classList.remove('open')});
    </script>
</body>
</html>
