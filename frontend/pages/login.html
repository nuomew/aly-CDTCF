<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 阿里云流量查询系统</title>
    <style>
        /* 全局重置 */
        *{margin:0;padding:0;box-sizing:border-box}
        /* 紫色渐变背景 */
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
        /* 登录卡片 */
        .login-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);
            padding:48px 40px;width:400px;max-width:90vw}
        /* 标题区域 */
        .login-header{text-align:center;margin-bottom:36px}
        .login-header h1{font-size:24px;font-weight:700;color:#1a1a2e;margin-bottom:8px}
        .login-header p{font-size:14px;color:#6b7280}
        /* 表单组 */
        .form-group{margin-bottom:20px}
        .form-group label{display:block;font-size:14px;font-weight:600;color:#374151;margin-bottom:8px}
        .form-group input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;
            font-size:14px;transition:border-color 0.3s,box-shadow 0.3s;outline:none}
        .form-group input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.15)}
        /* 登录按钮 */
        .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;
            transition:transform 0.2s,box-shadow 0.2s}
        .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(102,126,234,0.4)}
        .login-btn:active{transform:translateY(0)}
        .login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
        /* 错误提示 */
        .error-msg{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;
            padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
        /* 加载动画 */
        .loading{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);
            border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;
            vertical-align:middle;margin-right:8px}
        @keyframes spin{to{transform:rotate(360deg)}}
        /* 底部版权 */
        .login-footer{text-align:center;margin-top:24px;font-size:12px;color:rgba(255,255,255,0.6)}
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>管理员登录</h1>
            <p>阿里云流量查询系统</p>
        </div>
        <!-- 错误提示 -->
        <div class="error-msg" id="errorMsg"></div>
        <!-- 登录表单 -->
        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="loginBtn">登 录</button>
        </form>
    </div>
    <div class="login-footer">阿里云流量查询系统 &copy; 2025</div>

    <script>
        /**
         * 登录页面逻辑
         * 处理表单提交、API调用、错误提示、登录成功跳转
         */
        (function() {
            var form = document.getElementById('loginForm');
            var errorMsg = document.getElementById('errorMsg');
            var loginBtn = document.getElementById('loginBtn');

            // 检查是否已登录，已登录则直接跳转后台
            checkLogin();

            /**
             * 检查登录状态
             * 如果已登录则跳转到后台首页
             */
            function checkLogin() {
                fetch('/api/auth/check', { credentials: 'same-origin' })
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.logged_in) {
                            window.location.href = 'admin.html';
                        }
                    })
                    .catch(function() {});
            }

            /**
             * 显示错误信息
             * @param {string} msg - 错误信息文本
             */
            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
            }

            /**
             * 隐藏错误信息
             */
            function hideError() {
                errorMsg.style.display = 'none';
            }

            /**
             * 设置按钮加载状态
             * @param {boolean} loading - 是否加载中
             */
            function setLoading(loading) {
                loginBtn.disabled = loading;
                loginBtn.innerHTML = loading ? '<span class="loading"></span>登录中...' : '登 录';
            }

            // 表单提交事件
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                hideError();

                var username = document.getElementById('username').value.trim();
                var password = document.getElementById('password').value;

                // 前端验证
                if (!username) { showError('请输入用户名'); return; }
                if (!password) { showError('请输入密码'); return; }

                setLoading(true);

                // 调用登录API
                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username: username, password: password })
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.success) {
                        // 登录成功，跳转到后台首页
                        window.location.href = 'admin.html';
                    } else {
                        showError(data.error || '登录失败，请重试');
                        setLoading(false);
                    }
                })
                .catch(function(err) {
                    showError('网络错误，请检查连接');
                    setLoading(false);
                });
            });

            // 回车键提交
            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
            });
        })();
    </script>
</body>
</html>
