<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿里云流量查询系统</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ========== 全局重置与基础样式 ========== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary-start: #667eea;
      --primary-end: #764ba2;
      --card-radius: 16px;
      --card-shadow: 0 4px 24px rgba(102, 126, 234, 0.15);
      --text-primary: #1a1a2e;
      --text-secondary: #6b7280;
      --bg: #f0f2f5;
      --card-bg: #ffffff;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }

    /* ========== 顶部导航栏 ========== */
    .navbar {
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(102, 126, 234, 0.3);
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }
    .navbar-brand svg { flex-shrink: 0; }
    .navbar-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
    }
    .navbar-nav a {
      color: rgba(255,255,255,0.85);
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .navbar-nav a:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .navbar-nav .admin-link {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
    }
    .navbar-nav .admin-link:hover { background: rgba(255,255,255,0.3); }

    /* ========== 主内容区域 ========== */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    /* ========== 页面标题区域 ========== */
    .page-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .page-header h1 {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-start), var(--primary-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .page-header p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 4px;
    }

    /* ========== 统计卡片网格 ========== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 20px 24px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(102, 126, 234, 0.2); }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-start), var(--primary-end));
    }
    .stat-card .icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      font-size: 22px;
    }
    .stat-card .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: var(--text-primary); }
    .stat-card .sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

    /* ========== 通用区块标题 ========== */
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: '';
      width: 4px;
      height: 20px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--primary-start), var(--primary-end));
    }

    /* ========== 各配置流量卡片网格 ========== */
    .config-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .config-card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 24px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s;
    }
    .config-card:hover { transform: translateY(-2px); }
    .config-card .config-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
      color: var(--text-primary);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ========== SVG 环形进度条 ========== */
    .ring-wrap { position: relative; width: 120px; height: 120px; margin-bottom: 16px; }
    .ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .ring-wrap .ring-bg { fill: none; stroke: #e5e7eb; stroke-width: 10; }
    .ring-wrap .ring-fg {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s ease;
    }
    .ring-wrap .ring-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .ring-wrap .ring-text .pct { font-size: 22px; font-weight: 700; }
    .ring-wrap .ring-text .unit { font-size: 11px; color: var(--text-secondary); }

    /* ========== 大环形图（总体流量） ========== */
    .overview-section {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 28px;
      box-shadow: var(--card-shadow);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .big-ring-wrap { position: relative; width: 180px; height: 180px; flex-shrink: 0; }
    .big-ring-wrap svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .big-ring-wrap .ring-bg { fill: none; stroke: #e5e7eb; stroke-width: 14; }
    .big-ring-wrap .ring-fg { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
    .big-ring-wrap .ring-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .big-ring-wrap .ring-text .pct { font-size: 36px; font-weight: 700; }
    .big-ring-wrap .ring-text .label { font-size: 13px; color: var(--text-secondary); }
    .overview-info { flex: 1; }
    .overview-info h3 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
    .overview-info .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }
    .overview-info .info-row:last-child { border-bottom: none; }
    .overview-info .info-row .info-label { color: var(--text-secondary); }
    .overview-info .info-row .info-value { font-weight: 600; }

    /* ========== 趋势图区域 ========== */
    .chart-section {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 28px;
      box-shadow: var(--card-shadow);
      margin-bottom: 28px;
    }
    .chart-container { position: relative; height: 320px; }

    /* ========== 排行榜表格 ========== */
    .ranking-section {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 28px;
      box-shadow: var(--card-shadow);
      margin-bottom: 28px;
    }
    .ranking-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ranking-table th {
      text-align: left;
      padding: 12px 16px;
      background: #f9fafb;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 13px;
    }
    .ranking-table th:first-child { border-radius: 8px 0 0 8px; }
    .ranking-table th:last-child { border-radius: 0 8px 8px 0; }
    .ranking-table td { padding: 12px 16px; border-bottom: 1px solid #f3f4f6; }
    .ranking-table tr:last-child td { border-bottom: none; }
    .ranking-table .rank-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .rank-1 { background: linear-gradient(135deg, #f59e0b, #f97316); color: #fff; }
    .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); color: #fff; }
    .rank-3 { background: linear-gradient(135deg, #a0522d, #8b4513); color: #fff; }
    .rank-other { background: #f3f4f6; color: var(--text-secondary); }

    /* ========== 底部栏 ========== */
    .footer {
      text-align: center;
      padding: 20px 16px;
      color: var(--text-secondary);
      font-size: 13px;
      border-top: 1px solid #e5e7eb;
      margin-top: 12px;
    }
    .footer .update-time { margin-top: 4px; font-size: 12px; }

    /* ========== 空状态提示 ========== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .empty-state svg { margin-bottom: 16px; opacity: 0.5; }
    .empty-state p { font-size: 15px; }

    /* ========== 加载状态 ========== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #e5e7eb;
      border-top-color: var(--primary-start);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== 错误提示 ========== */
    .error-toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }
    .error-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

    /* ========== 响应式布局 ========== */
    @media (max-width: 1024px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .config-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .navbar { padding: 0 12px; }
      .navbar-nav { gap: 2px; }
      .navbar-nav a { padding: 5px 10px; font-size: 13px; }
      .navbar-brand { font-size: 15px; }
      .container { padding: 16px 12px 32px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-card { padding: 14px 16px; }
      .stat-card .value { font-size: 22px; }
      .config-grid { grid-template-columns: 1fr; }
      .overview-section { flex-direction: column; gap: 24px; }
      .big-ring-wrap { width: 150px; height: 150px; }
      .chart-container { height: 240px; }
      .ranking-table th, .ranking-table td { padding: 10px 8px; font-size: 13px; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat-card .value { font-size: 20px; }
      .page-header h1 { font-size: 20px; }
      .ring-wrap { width: 100px; height: 100px; }
      .ring-wrap .ring-text .pct { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- 加载遮罩 -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <!-- 错误提示 -->
  <div class="error-toast" id="errorToast"></div>

  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="8" fill="rgba(255,255,255,0.2)"/>
        <path d="M8 14C8 10.686 10.686 8 14 8s6 2.686 6 6-2.686 6-6 6-6-2.686-6-6z" stroke="#fff" stroke-width="2"/>
        <path d="M14 6v2M14 20v2M6 14h2M20 14h2" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span id="navSiteName">阿里云流量查询系统</span>
    </a>
    <ul class="navbar-nav">
      <li><a href="#stats">概览</a></li>
      <li><a href="#trend">趋势</a></li>
      <li><a href="#ranking">排行</a></li>
      <li><a href="/admin" class="admin-link">管理后台</a></li>
    </ul>
  </nav>

  <!-- 主内容区域 -->
  <main class="container">

    <!-- 页面标题 -->
    <div class="page-header">
      <h1 id="pageTitle">阿里云流量查询系统</h1>
      <p id="pageDesc">云数据传输流量监控平台</p>
    </div>

    <!-- 4个统计卡片 -->
    <div class="stats-grid" id="stats">
      <div class="stat-card">
        <div class="icon" style="background: linear-gradient(135deg, #667eea20, #764ba220);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </div>
        <div class="label">启用 / 总配置数</div>
        <div class="value" id="statConfig">-- / --</div>
        <div class="sub">已启用 / 全部配置</div>
      </div>
      <div class="stat-card">
        <div class="icon" style="background: linear-gradient(135deg, #22c55e20, #16a34a20);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </div>
        <div class="label">今日流量</div>
        <div class="value" id="statToday">--</div>
        <div class="sub">当日使用量</div>
      </div>
      <div class="stat-card">
        <div class="icon" style="background: linear-gradient(135deg, #f59e0b20, #d9770620);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </div>
        <div class="label">昨日流量</div>
        <div class="value" id="statYesterday">--</div>
        <div class="sub">昨日使用量</div>
      </div>
      <div class="stat-card">
        <div class="icon" style="background: linear-gradient(135deg, #ef444420, #dc262620);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="label">本月流量</div>
        <div class="value" id="statMonth">--</div>
        <div class="sub">本月累计出方向</div>
      </div>
    </div>

    <!-- 各配置流量使用情况 -->
    <div id="configSection">
      <h2 class="section-title">各配置流量使用情况</h2>
      <div class="config-grid" id="configGrid"></div>
    </div>

    <!-- 总体流量统计 -->
    <div id="overviewSection">
      <h2 class="section-title">总体流量统计</h2>
      <div class="overview-section" id="overviewCard"></div>
    </div>

    <!-- 近7天流量趋势 -->
    <div id="trend">
      <h2 class="section-title">近7天流量趋势</h2>
      <div class="chart-section">
        <div class="chart-container">
          <canvas id="trendChart"></canvas>
        </div>
      </div>
    </div>

    <!-- 流量排行 TOP10 -->
    <div id="ranking">
      <h2 class="section-title">流量排行 TOP 10</h2>
      <div class="ranking-section">
        <table class="ranking-table" id="rankingTable">
          <thead>
            <tr>
              <th style="width:60px">排名</th>
              <th>配置名称</th>
              <th style="text-align:right">出方向流量</th>
              <th style="text-align:right">总流量</th>
            </tr>
          </thead>
          <tbody id="rankingBody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- 底部栏 -->
  <footer class="footer">
    <div id="footerCopyright">© 2026 阿里云流量查询系统</div>
    <div class="update-time" id="footerUpdateTime"></div>
  </footer>

  <script>
    /**
     * 阿里云流量查询系统 - 前端首页
     * 从 /api/traffic/dashboard 获取数据并渲染所有组件
     */

    // ========== 全局变量 ==========
    let chartInstance = null;    // Chart.js 图表实例
    let refreshTimer = null;     // 自动刷新定时器

    // ========== 工具函数 ==========

    /**
     * 格式化字节大小为可读字符串
     * @param {number} bytes - 字节数
     * @param {number} decimals - 小数位数，默认2位
     * @returns {string} 格式化后的字符串（B/KB/MB/GB/TB）
     */
    function formatBytes(bytes, decimals = 2) {
      bytes = parseFloat(bytes);
      if (bytes < 0 || isNaN(bytes)) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
      const factor = Math.floor((String(Math.floor(bytes)).length - 1) / 3);
      if (factor >= units.length) return bytes.toFixed(decimals) + ' ' + units[units.length - 1];
      if (factor === 0) return bytes.toFixed(decimals) + ' B';
      return (bytes / Math.pow(1024, factor)).toFixed(decimals) + ' ' + units[factor];
    }

    /**
     * 格式化 GB 流量为可读字符串
     * @param {number} gb - GB 数值
     * @returns {string} 格式化后的字符串
     */
    function formatGB(gb) {
      gb = parseFloat(gb);
      if (gb >= 1024) return (gb / 1024).toFixed(2) + ' TB';
      return gb.toFixed(2) + ' GB';
    }

    /**
     * 显示错误提示
     * @param {string} msg - 错误消息
     */
    function showError(msg) {
      const toast = document.getElementById('errorToast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    /**
     * 隐藏加载遮罩
     */
    function hideLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }

    /**
     * 根据使用百分比返回对应的颜色
     * @param {number} pct - 百分比（0-100）
     * @returns {string} 颜色值
     */
    function getPercentColor(pct) {
      if (pct >= 90) return '#ef4444';
      if (pct >= 70) return '#f59e0b';
      return '#667eea';
    }

    // ========== 数据获取 ==========

    /**
     * 从API获取仪表盘数据并渲染页面
     * @param {boolean} isAutoRefresh - 是否为自动刷新调用
     */
    async function fetchDashboard(isAutoRefresh = false) {
      try {
        const resp = await fetch('/api/traffic/dashboard');
        const json = await resp.json();
        if (!json.success) {
          showError('获取数据失败: ' + (json.message || '未知错误'));
          hideLoading();
          return;
        }
        renderDashboard(json.data);

        // 配置自动刷新
        if (json.data.autoRefreshEnabled && !refreshTimer) {
          const interval = (json.data.autoRefreshInterval || 5) * 60 * 1000;
          refreshTimer = setInterval(() => fetchDashboard(true), interval);
        }
      } catch (err) {
        console.error('请求失败:', err);
        if (!isAutoRefresh) {
          showError('网络请求失败，请检查网络连接');
        }
      }
      hideLoading();
    }

    // ========== 渲染函数 ==========

    /**
     * 渲染整个仪表盘
     * @param {object} data - API返回的数据对象
     */
    function renderDashboard(data) {
      // 更新页面标题
      document.title = data.siteName || '阿里云流量查询系统';
      document.getElementById('navSiteName').textContent = data.siteName || '阿里云流量查询系统';
      document.getElementById('pageTitle').textContent = data.siteName || '阿里云流量查询系统';
      document.getElementById('pageDesc').textContent = data.siteDesc || '云数据传输流量监控平台';
      document.getElementById('footerCopyright').textContent = '© ' + new Date().getFullYear() + ' ' + (data.siteName || '阿里云流量查询系统');

      // 更新数据时间
      if (data.lastRefreshTime) {
        document.getElementById('footerUpdateTime').textContent = '数据更新时间: ' + data.lastRefreshTime;
      }

      // 渲染统计卡片
      renderStats(data);

      // 渲染各配置卡片
      renderConfigCards(data);

      // 渲染总体流量环形图
      renderOverviewRing(data);

      // 渲染趋势图
      renderTrendChart(data);

      // 渲染排行榜
      renderRanking(data);
    }

    /**
     * 渲染4个统计卡片
     * @param {object} data - 仪表盘数据
     */
    function renderStats(data) {
      document.getElementById('statConfig').textContent = data.configCount + ' / ' + data.totalConfigCount;
      document.getElementById('statToday').textContent = formatBytes(data.todayTraffic);
      document.getElementById('statYesterday').textContent = formatBytes(data.yesterdayTraffic);
      document.getElementById('statMonth').textContent = formatBytes(data.monthTrafficOut);
    }

    /**
     * 渲染各配置流量使用卡片（含环形进度条）
     * @param {object} data - 仪表盘数据
     */
    function renderConfigCards(data) {
      const grid = document.getElementById('configGrid');

      // 无配置时显示空状态
      if (!data.configs || data.configs.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1;">
            <div class="empty-state">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5">
                <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
              </svg>
              <p>暂无启用的配置，请先在后台添加阿里云AccessKey</p>
            </div>
          </div>`;
        document.getElementById('configSection').style.display = 'block';
        return;
      }

      // 计算每个配置的使用百分比和环形进度
      const circumference = 2 * Math.PI * 45; // SVG 圆的周长 (r=45)
      grid.innerHTML = data.configs.map(cfg => {
        const usedGB = cfg.month_traffic_gb || 0;
        const maxGB = cfg.max_traffic_gb || 1000;
        const pct = Math.min(100, Math.round((usedGB / maxGB) * 100 * 10) / 10);
        const dashoffset = circumference - (pct / 100) * circumference;
        const color = getPercentColor(pct);

        return `
          <div class="config-card">
            <div class="config-name" title="${cfg.name}">${cfg.name}</div>
            <div class="ring-wrap">
              <svg viewBox="0 0 100 100">
                <circle class="ring-bg" cx="50" cy="50" r="45"/>
                <circle class="ring-fg" cx="50" cy="50" r="45"
                  stroke="${color}"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${dashoffset}"/>
              </svg>
              <div class="ring-text">
                <div class="pct" style="color:${color}">${pct}%</div>
                <div class="unit">${formatGB(usedGB)} / ${formatGB(maxGB)}</div>
              </div>
            </div>
            <div style="font-size:12px;color:var(--text-secondary);text-align:center;">
              入: ${formatGB(cfg.month_in_gb || 0)} &nbsp;|&nbsp; 出: ${formatGB(cfg.month_out_gb || 0)}
            </div>
          </div>`;
      }).join('');
    }

    /**
     * 渲染总体流量统计大环形图
     * @param {object} data - 仪表盘数据
     */
    function renderOverviewRing(data) {
      const circumference = 2 * Math.PI * 70; // 大圆周长 (r=70)
      const pct = data.totalTrafficPercent || 0;
      const dashoffset = circumference - (pct / 100) * circumference;
      const color = getPercentColor(pct);

      document.getElementById('overviewCard').innerHTML = `
        <div class="big-ring-wrap">
          <svg viewBox="0 0 160 160">
            <circle class="ring-bg" cx="80" cy="80" r="70"/>
            <circle class="ring-fg" cx="80" cy="80" r="70"
              stroke="${color}"
              stroke-dasharray="${circumference}"
              stroke-dashoffset="${dashoffset}"/>
          </svg>
          <div class="ring-text">
            <div class="pct" style="color:${color}">${pct}%</div>
            <div class="label">总体使用率</div>
          </div>
        </div>
        <div class="overview-info">
          <h3>总体流量统计</h3>
          <div class="info-row">
            <span class="info-label">本月总流量</span>
            <span class="info-value">${formatBytes(data.monthTrafficTotal)}</span>
          </div>
          <div class="info-row">
            <span class="info-label">本月出方向流量</span>
            <span class="info-value">${formatBytes(data.monthTrafficOut)}</span>
          </div>
          <div class="info-row">
            <span class="info-label">已使用流量</span>
            <span class="info-value">${formatGB(data.totalCurrentTraffic || 0)}</span>
          </div>
          <div class="info-row">
            <span class="info-label">总配额</span>
            <span class="info-value">${formatGB(data.totalMaxTraffic || 0)}</span>
          </div>
          <div class="info-row">
            <span class="info-label">今日流量</span>
            <span class="info-value">${formatBytes(data.todayTraffic)}</span>
          </div>
          <div class="info-row">
            <span class="info-label">昨日流量</span>
            <span class="info-value">${formatBytes(data.yesterdayTraffic)}</span>
          </div>
        </div>`;
    }

    /**
     * 渲染近7天流量趋势柱状图（Chart.js）
     * @param {object} data - 仪表盘数据
     */
    function renderTrendChart(data) {
      const weekly = data.weeklyStats || [];
      const labels = weekly.map(w => {
        const parts = w.record_date.split('-');
        return parts[1] + '-' + parts[2]; // 只显示 MM-DD
      });
      const values = weekly.map(w => w.traffic_total);

      // 销毁旧图表实例避免重复
      if (chartInstance) {
        chartInstance.destroy();
      }

      const ctx = document.getElementById('trendChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '每日流量',
            data: values,
            backgroundColor: 'rgba(102, 126, 234, 0.7)',
            borderColor: '#667eea',
            borderWidth: 1,
            borderRadius: 6,
            maxBarThickness: 50
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return '流量: ' + formatBytes(context.parsed.y);
                }
              }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { font: { size: 12 } }
            },
            y: {
              beginAtZero: true,
              grid: { color: '#f3f4f6' },
              ticks: {
                font: { size: 12 },
                callback: function(value) { return formatBytes(value); }
              }
            }
          }
        }
      });
    }

    /**
     * 渲染流量排行 TOP10 表格
     * @param {object} data - 仪表盘数据
     */
    function renderRanking(data) {
      const tbody = document.getElementById('rankingBody');
      const list = data.ranking || [];

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:32px;color:var(--text-secondary);">暂无排行数据</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map((item, idx) => {
        const rank = idx + 1;
        const rankClass = rank <= 3 ? 'rank-' + rank : 'rank-other';
        return `
          <tr>
            <td><span class="rank-num ${rankClass}">${rank}</span></td>
            <td>${item.name}</td>
            <td style="text-align:right;font-weight:600;">${formatBytes(item.traffic_out)}</td>
            <td style="text-align:right;font-weight:600;">${formatBytes(item.traffic_total)}</td>
          </tr>`;
      }).join('');
    }

    // ========== 页面初始化 ==========
    document.addEventListener('DOMContentLoaded', function() {
      fetchDashboard();
    });
  </script>

</body>
</html>
